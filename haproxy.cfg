global
    log     stdout format raw local0
    maxconn 1024
    daemon

defaults
    log     global
    mode    http
    option  httplog
    option  dontlognull
    option  forwardfor
    option  http-server-close
    timeout connect  5s
    timeout client  30s
    timeout server  30s
    retries 3

# ── Stats-Seite (intern erreichbar) ──────────────────────────────────────────
listen stats
    bind *:8404
    stats enable
    stats uri /stats
    stats refresh 5s
    stats show-legends
    stats show-node

# ── Frontend: externer Eingang ────────────────────────────────────────────────
frontend http_front
    bind *:8080
    default_backend web_servers

# ── Backend: Apache-Instanzen ─────────────────────────────────────────────────
backend web_servers
    balance     roundrobin
    option      httpchk GET /login.php
    http-check  expect status 200

    # Sticky Session: Client bleibt am selben Server (via PHPSESSID-Cookie)
    cookie PHPSESSID prefix nocache

    server web1 apache-server-1:8080 check inter 2s fall 2 rise 2 cookie web1
    server web2 apache-server-2:8080 check inter 2s fall 2 rise 2 cookie web2
